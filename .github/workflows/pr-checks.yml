name: PR checks

on:
  push:
    branches: [main]
  pull_request:
    # edited: validate again after the description changes.
    # synchronize: a new push must still match the Head: line.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  identity:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    name: identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neutral commit identity
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_identity.py \
              "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ "$BEFORE" = "$ZERO" ]; then
              python3 scripts/check_identity.py "${HEAD_SHA}^!"
            else
              python3 scripts/check_identity.py "${BEFORE}..${HEAD_SHA}"
            fi
          fi

  pr-body:
    if: github.event_name == 'pull_request'
    name: pr-body
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Strip Cursor wrapper and validate the PR body
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_pr_body.py --github --head "$PR_HEAD"

  version-bump:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    name: version-bump
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare Cargo.toml with the base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_version_bump.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --event-file "$GITHUB_EVENT_PATH"
          else
            BEFORE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ "$BEFORE" = "$ZERO" ]; then
              echo "version-bump: new ref; nothing to compare"
              exit 0
            fi
            python3 scripts/check_version_bump.py \
              --base "$BEFORE" \
              --head "$HEAD_SHA" \
              --event-file "$GITHUB_EVENT_PATH"
          fi

  python-check-tests:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    name: python-check-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for the local checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_check_*.py' -v
