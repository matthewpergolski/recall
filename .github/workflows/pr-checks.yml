name: PR checks

on:
  push:
    branches: [main]
  pull_request:
    # edited: re-run pr-body when the description is cleaned after open
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  identity:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    name: identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neutral commit identity
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_identity.py \
              "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ "$BEFORE" = "$ZERO" ]; then
              python3 scripts/check_identity.py "${HEAD_SHA}^!"
            else
              python3 scripts/check_identity.py "${BEFORE}..${HEAD_SHA}"
            fi
          fi

  pr-body:
    if: github.event_name == 'pull_request'
    name: pr-body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PR body shape
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_body.py

  python-check-tests:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    name: python-check-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for identity and PR-body checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_check_*.py' -v
